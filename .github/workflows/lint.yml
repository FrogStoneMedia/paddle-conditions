name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # GitHub-hosted on purpose: this is a public repo and pull_request runs
    # contributor code. Never point this at the self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==$(grep -oP '^ruff==\K.*' requirements_test.txt)"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
