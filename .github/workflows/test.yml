name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements_test.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - run: python3 -m pip install -r requirements_test.txt
      - run: python3 -m pytest tests/ --cov=custom_components/paddle_conditions --cov-report=xml -v
