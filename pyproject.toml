[project]
name = "paddle-conditions"
version = "2.0.0"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Checked against the installed Home Assistant, not stubs-less Any.
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_unreachable = true
files = ["custom_components/paddle_conditions"]
